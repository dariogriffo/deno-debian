name: Build deno for Debian

on:
  workflow_dispatch:
    inputs:
      deno_version:
        description: The version of deno to build.
        type: string
        required: true
      build_version:
        description: The build version.
        type: string
        required: true
      architecture:
        description: Architecture to build (amd64, arm64, or 'all' for all architectures)
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'amd64'
          - 'arm64'

permissions:
  contents: write

jobs:
  build-deno:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deno-debian
        uses: actions/checkout@v4

      - name: Build deno
        run: ./build.sh ${{ inputs.deno_version }} ${{ inputs.build_version }} ${{ inputs.architecture }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: |
            deno_*.deb
            denort_*.deb

  build-src:
    name: Build Source Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deno-debian
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends dpkg-dev devscripts wget ca-certificates

      - name: Build source packages
        run: ./build_src.sh ${{ inputs.deno_version }} ${{ inputs.build_version }}

      - name: Upload Source Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: source-artifact
          path: |
            deno_*.dsc
            deno_*.orig.tar.gz
            deno_*.debian.tar.xz

  release-deno:
    name: Release deno for Debian
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-deno, build-src]
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifact

      - name: Download Source Artifacts
        uses: actions/download-artifact@v4
        with:
          name: source-artifact

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            deno_*.deb
            denort_*.deb
            deno_*.dsc
            deno_*.orig.tar.gz
            deno_*.debian.tar.xz
          name: ${{ inputs.deno_version }}+${{ inputs.build_version }}
          tag_name: ${{ inputs.deno_version }}+${{ inputs.build_version }}
          fail_on_unmatched_files: true
